function highlightMatch(text, query) {
  if (!query) return text;
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 0);
  if (words.length === 0) return text;
  const regex = new RegExp(`(${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
  const parts = text.split(regex);
  return parts.map((part, i) =>
    words.some(w => part.toLowerCase() === w)
      ? React.createElement('mark', { key: i }, part)
      : part
  );
}

// CLINICAL ABBREVIATIONS
// ═══════════════════════════════════════════════════════════════════════════
// Used by both search (fuzzyScore) and autocomplete (findAutoCompleteMatches).
// Bare abbreviation match: "PTSD" → shows all PTSD entries
// Abbreviation + specifiers: "ADHD, combined" → matches combined presentation
// ═══════════════════════════════════════════════════════════════════════════
const ABBREVIATIONS = {
  'ptsd': 'posttraumatic stress disorder',
  'adhd': 'attention-deficit/hyperactivity disorder',
  'ocd': 'obsessive-compulsive disorder',
  'gad': 'generalized anxiety disorder',
  'mdd': 'major depressive disorder',

  'ied': 'intermittent explosive disorder',
  'ted': 'tobacco use disorder',
  'aud': 'alcohol use disorder',
  'oud': 'opioid use disorder',
  'sud': 'substance use disorder',
  'bed': 'binge-eating disorder',
  'pdd': 'persistent depressive disorder',
  'pgd': 'prolonged grief disorder',
  'pmdd': 'premenstrual dysphoric disorder',
  'dpd': 'dependent personality disorder',
  'rad': 'reactive attachment disorder',
  'sld': 'specific learning disorder',
  'dmdd': 'disruptive mood dysregulation disorder',
};

function fuzzyScore(item, query) {
  const q = query.toLowerCase().trim();
  if (!q) return 1;
  
  // Expand abbreviation at start
  let expandedQ = q;
  const firstWord = q.split(/[\s,]+/)[0];
  if (ABBREVIATIONS[firstWord]) {
    expandedQ = q.replace(firstWord, ABBREVIATIONS[firstWord]);
  }
  
  // Check full abbreviation match
  if (ABBREVIATIONS[q]) {
    return item.diagnosis.toLowerCase().startsWith(ABBREVIATIONS[q]) ? 100 : 0;
  }
  
  const words = expandedQ.split(/[\s,;\/()\-–—&>]+/).filter(w => w.length > 0);
  const searchTarget = `${item.diagnosis} ${item.fCode} ${item.icd9}`.toLowerCase();
  const targetWords = searchTarget.split(/[\s,;\/()\-–—&>]+/).filter(w => w.length > 0);
  let totalScore = 0;
  let matchCount = 0;
  for (const w of words) {
    if (searchTarget.includes(w)) {
      totalScore += w.length * 2;
      matchCount++;
    } else if (w.length >= 2) {
      const { similarity } = bestWordMatch(w, targetWords);
      if (similarity >= 0.5) {
        totalScore += similarity * w.length;
        matchCount++;
      }
    }
  }
  // Require all words to match
  if (matchCount < words.length) return 0;
  // Bonus: shorter diagnoses that match all words are more relevant
  const lengthPenalty = Math.max(0.5, 1 - (item.diagnosis.length - q.length) / 200);
  return totalScore * lengthPenalty;
}

// ═══════════════════════════════════════════════════════════════════════════
// INPUT CLEANING & ICD CODE EXTRACTION
// ═══════════════════════════════════════════════════════════════════════════
// PROBLEM SOLVED: Bulk input comes from EMR copy-paste with bullets, dashes,
// numbering, and embedded ICD codes in various formats:
//   "- Iron deficiency anemia (ICD-10: D50.0)"
//   "1) Major depressive disorder (F32.1)"
//   "• PTSD"
//   "Hypertension - I10"
//
// SOLUTION: Strip formatting, extract ICD codes, return clean text.
// The embeddedCode is used both for DSM F-code lookup AND for passthrough
// of non-psychiatric diagnoses (if code doesn't start with F or Z, it's
// passed through as-entered with the medical ICD code preserved).
// ═══════════════════════════════════════════════════════════════════════════
function cleanInput(raw) {
  let s = raw.trim();
  // Strip leading bullets, dashes, numbers
  s = s.replace(/^[-–—•*]\s*/, '');
  s = s.replace(/^\d+[.)]\s*/, '');
  // Extract embedded ICD-10 code if present
  let embeddedCode = null;
  // Format: (ICD-10: D50.0) or (ICD-10-CM: F41.1)
  const icdMatch = s.match(/\(?\s*ICD[- ]?10[- ]?(?:CM)?\s*:\s*([A-Z]\d[\d.]*)\s*\)?/i);
  if (icdMatch) {
    embeddedCode = icdMatch[1].toUpperCase();
    s = s.replace(icdMatch[0], '').trim();
  }
  // Format: bare code in parens like (F41.1) or (D50.0)
  if (!embeddedCode) {
    const bareCode = s.match(/\(\s*([A-Z]\d[\d.]*)\s*\)/i);
    if (bareCode) {
      embeddedCode = bareCode[1].toUpperCase();
      s = s.replace(bareCode[0], '').trim();
    }
  }
  // Format: trailing code after dash/comma like "Hypertension - I10" or "Anemia, D50.0"
  if (!embeddedCode) {
    const trailingCode = s.match(/[-–,]\s*([A-Z]\d[\d.]{1,5})\s*$/i);
    if (trailingCode) {
      embeddedCode = trailingCode[1].toUpperCase();
      s = s.replace(trailingCode[0], '').trim();
    }
  }
  // Format: leading code like "F33.12 Major Depressive Disorder"
  if (!embeddedCode) {
    const lc = s.match(/^([A-Z]\d[\d.]{1,5})\s+(.+)/i);
    if (lc) { embeddedCode = lc[1].toUpperCase(); s = lc[2].trim(); }
  }
  // Strip trailing commas/periods
  s = s.replace(/[,.\s]+$/, '');
  return { cleaned: s, embeddedCode };
}

// BEST MATCH — CORE DIAGNOSIS MATCHING ENGINE (used by Bulk Mode)
// ═══════════════════════════════════════════════════════════════════════════
// PROBLEM SOLVED: Given messy clinical input, find the correct DSM-5 diagnosis.
// Must handle: typos, DSM-IV terms, abbreviations, street drug names,
// embedded ICD codes, non-psychiatric diagnoses, and specifier disambiguation.
//
// MATCHING PIPELINE (in priority order):
//   1. Abbreviation expansion (PTSD → posttraumatic stress disorder)
//   2. Phrase synonym expansion (dependence → use disorder, heroin → opioid)
//   3. Non-psychiatric rejection (ICD code not F/Z, or first word not in any diagnosis)
//   4. Exact match on cleaned/expanded text
//   5. F-code direct match (user typed "F31.81")
//   6. Substring match (expanded input found verbatim inside a diagnosis name)
//   7. Fuzzy word-by-word scoring with specifier weighting
//
// KEY PROBLEMS SOLVED IN THIS FUNCTION:
//
// [P1] "Alcohol dependence" → was matching "Alcohol intoxication, Without use disorder"
//      FIX: Phrase synonym "dependence" → "use disorder" + substring matching step
//      catches "alcohol use disorder" as a phrase before fuzzy scoring runs.
//
// [P2] "Sedative hypnotic dependence" → was matching "Separation anxiety disorder"
//      FIX: Phrase synonym "sedative hypnotic" → "sedative, hypnotic, or anxiolytic"
//      expands the compound clinical term before matching.
//
// [P3] "Iron deficiency anemia (ICD-10: D50.0)" → was matching "Specific phobia, Animal"
//      FIX: Non-F/Z ICD code rejection gate returns null immediately.
//
// [P4] "Hypertension" → was matching "Idiopathic hypoventilation"
//      FIX: First-significant-word gate requires the word to appear in the first
//      4 words of at least one diagnosis. "hypert..." doesn't start any DSM entry.
//
// [P5] "Diabetes mellitus type 2" → was matching narcolepsy entry containing "type 2 diabetes"
//      FIX: Same first-word gate — "diabet..." doesn't start any DSM entry (it only
//      appears at the END of one entry, which the gate correctly rejects).
//
// [P6] "Social anxiety disorder" → was matching "Generalized anxiety disorder"
//      FIX: Word-order bonus gives 1.2x score when input words match in order.
//      "social anxiety disorder" matches in-order for social anxiety but not GAD.
//
// [P7] "Schizoaffective disorder" → was matching "Schizophrenia"
//      FIX: Substring match step catches "schizoaffective disorder" verbatim
//      inside "Schizoaffective disorder, Bipolar type" before fuzzy scoring.
//
// [P8] "MDD" alone → was matching "Erectile disorder"
//      FIX: Abbreviation expansion runs first, converting to "major depressive disorder"
//      which then hits substring matching.
//
// [P9] 50% quality gate — requires at least half of input words to match something.
//      Prevents garbage matches when most input words are medical (non-psych) terms.
// ═══════════════════════════════════════════════════════════════════════════

  for (const [correct, typos] of Object.entries(FUZZY_WORD_FIXES)) {
    for (const typo of typos) {
      const typoRe = new RegExp('\\b' + typo + '\\b', 'gi');
      expandedQ = expandedQ.replace(typoRe, correct);
    }
  }

  // If input contains a non-F/non-Z ICD code, it's not a psychiatric diagnosis
  if (embeddedCode && !/^[FZ]/i.test(embeddedCode)) {
    return null;
  }

  // 1) Try exact diagnosis match on cleaned/expanded text
  const exact = data.find(d => d.diagnosis.toLowerCase() === q) ||
                data.find(d => d.diagnosis.toLowerCase() === expandedQ);
  if (exact) return exact;

  // 2) Try F code match
  const fMatch = data.find(d => d.fCode.toLowerCase() === q);
  if (fMatch) return fMatch;

  // 3) Try substring match — if expanded query is contained in a diagnosis name  
  const substringMatches = data.filter(d => d.diagnosis.toLowerCase().includes(expandedQ));
  if (substringMatches.length === 1) return substringMatches[0];
  if (substringMatches.length > 1) {
    // Pick shortest (most specific match)
    substringMatches.sort((a, b) => a.diagnosis.length - b.diagnosis.length);
    return substringMatches[0];
  }

  // 4) Smart scoring
  const specifierWords = new Set([
    'mild', 'moderate', 'severe',
    'single', 'recurrent',
    'partial', 'full', 'remission',
    'psychotic', 'features',
    'depressed', 'manic', 'hypomanic', 'unspecified',
    'combined', 'inattentive', 'hyperactive', 'impulsive',
    'restricting', 'binge', 'purging',
    'childhood', 'adolescent', 'adult', 'children',
    'animal', 'situational', 'blood', 'injection', 'injury',
    'anxiety', 'conduct', 'emotions',
    'bipolar', 'depressive', 'dissociative',
    'type', 'presentation',
    'i', 'ii',
  ]);

  const ignoreWords = new Set(['chronic', 'acute', 'nos', 'type', 'subtype', 'pcp']);

  const inputWords = expandedQ.split(/[\s,;\/()\-–—&>]+/).filter(w => w.length > 0);

  // Pre-filter: only score diagnoses that contain at least the first significant input word
  const firstSigWord = inputWords.find(w => w.length >= 4 && !ignoreWords.has(w));
  
  // Non-psychiatric rejection: if the first significant word doesn't appear near the START
  // of ANY diagnosis, this probably isn't a psychiatric term
  if (firstSigWord && firstSigWord.length >= 5) {
    const prefix4 = firstSigWord.slice(0, 4);
    const anyDiagStartsWithWord = data.some(d => {
      const dWords = d.diagnosis.toLowerCase().split(/[\s,/()-]+/).slice(0, 4);
      return dWords.some(dw => dw.startsWith(prefix4) || wordSimilarity(firstSigWord, dw) >= 0.6);
    });
    if (!anyDiagStartsWithWord) return null;
  }
  
  let bestScore = -Infinity;
  let bestItem = null;

  for (const item of data) {
    const target = item.diagnosis.toLowerCase();
    const targetWords = target.split(/[\s,/()-]+/).filter(w => w.length > 0);
    
    // Quick reject: first significant word must at least fuzzy-match
    if (firstSigWord) {
      const hasPrefixHit = targetWords.some(tw => tw.startsWith(firstSigWord.slice(0, 3)));
      const hasSubstr = target.includes(firstSigWord.slice(0, 4));
      if (!hasPrefixHit && !hasSubstr) {
        const { similarity } = bestWordMatch(firstSigWord, targetWords);
        if (similarity < 0.5) continue;
      }
    }
    
    let score = 0;
    let matchedWordCount = 0;
    const totalInputWords = inputWords.filter(w => !ignoreWords.has(w) && w.length >= 2).length;

    for (const w of inputWords) {
      const synonym = SYNONYMS[w];
      const wordsToTry = synonym && synonym !== '' ? [w, synonym] : [w];
      
      let matched = false;
      for (const tryW of wordsToTry) {
        const hasExactWord = tryW.length <= 2 
          ? targetWords.some(tw => tw === tryW)
          : target.includes(tryW);
        
        if (hasExactWord) {
          if (specifierWords.has(tryW)) {
            score += 10;
          } else {
            score += tryW.length;
          }
          matched = true;
          matchedWordCount++;
          break;
        }
      }
      
      if (!matched && w.length >= 2) {
        if (ignoreWords.has(w)) continue;
        
        const { similarity, word: matchedWord } = bestWordMatch(w, targetWords);
        if (similarity >= 0.5) {
          score += specifierWords.has(matchedWord) ? 8 : Math.max(1, Math.round(w.length * similarity));
          matchedWordCount++;
        }
      }
    }

    // QUALITY GATE: require at least 50% of significant input words to match
    if (totalInputWords >= 2 && matchedWordCount < totalInputWords * 0.5) continue;
    
    // QUALITY GATE 2: require at least 2 matched words for multi-word inputs
    if (totalInputWords >= 3 && matchedWordCount < 2) continue;

    // PENALTY: if input has a specifier the target doesn't have
    for (const w of inputWords) {
      if (ignoreWords.has(w)) continue;
      if (specifierWords.has(w)) {
        const synonym = SYNONYMS[w];
        const hasExact = w.length <= 2 ? targetWords.some(tw => tw === w) : target.includes(w);
        const hasSynonym = synonym ? (synonym.length <= 2 ? targetWords.some(tw => tw === synonym) : target.includes(synonym)) : false;
        if (!hasExact && !hasSynonym) {
          const { similarity } = bestWordMatch(w, targetWords);
          if (similarity < 0.35) score -= 15;
        }
      }
    }

    // PENALTY: if target has specifiers the input doesn't mention
    for (const tw of targetWords) {
      if (specifierWords.has(tw) && !inputWords.some(iw => {
        if (iw === tw) return true;
        return bestWordMatch(iw, [tw]).similarity >= 0.5;
      })) {
        score -= 5;
      }
    }

    // COVERAGE: prefer diagnoses where input covers most of the target
    const inputCoverage = inputWords.length / targetWords.length;
    score *= (0.3 + 0.7 * inputCoverage);

    // BONUS: exact word-order match gets a boost
    let orderIdx = 0;
    for (const tw of targetWords) {
      if (orderIdx < inputWords.length && (inputWords[orderIdx] === tw || wordSimilarity(inputWords[orderIdx], tw) >= 0.6)) {
        orderIdx++;
      }
    }
    if (orderIdx === inputWords.length) score *= 1.2; // all input words matched in order

    // BONUS: if input contains "use disorder" as a primary term, strongly prefer
    // diagnoses where "use disorder" is in the BASE name (before first comma),
    // not just appearing as a specifier like "Without use disorder"
    if (expandedQ.includes('use disorder')) {
      const baseDiag = target.split(',')[0];
      if (baseDiag.includes('use disorder')) {
        score *= 1.5;
      } else if (target.includes('without use disorder')) {
        score *= 0.3; // strong penalty — user wants USE disorder, not "without" it
      }
    }

    if (score > bestScore) {
      bestScore = score;
      bestItem = item;
    }
  }

  // Higher threshold to avoid garbage matches for non-psychiatric terms
  if (bestScore >= 5) return bestItem;

  // Fallback: embedded ICD-10 code
  if (embeddedCode) {
    const codeMatch = data.find(d => d.fCode.toUpperCase() === embeddedCode);
    if (codeMatch) return codeMatch;
    const partial = data.filter(d => d.fCode.toUpperCase().startsWith(embeddedCode));
    if (partial.length === 1) return partial[0];
  }

  return null;
}

// ═══════════════════════════════════════════════════════════════════════════
// FUZZY MATCHING ENGINE
// ═══════════════════════════════════════════════════════════════════════════
// PROBLEM SOLVED: Clinicians type diagnoses with severe typos, abbreviations,
// and DSM-IV terminology. Standard exact/prefix matching fails completely.
//
// SOLUTION: Multi-signal similarity scoring combining 4 algorithms:
//   1. Levenshtein distance — edit distance (insertion/deletion/substitution)
//   2. Trigram similarity — overlapping 3-char sequences (handles transpositions)
//   3. Bigram similarity — overlapping 2-char sequences (more lenient)
//   4. Character frequency — bag-of-chars overlap (catches anagram-like typos)
//
// The final wordSimilarity() picks the best signal:
//   combined = (bestNgram * 0.4) + (adjustedCharFreq * 0.35) + (levSim * 0.15) + (lenRatio * 0.1)
//   return max(combined, levSim, bestNgram)
//
// THRESHOLD: 0.5 for fuzzy word matching (raised from 0.4 after false positives
// like "anemia" → "animal" at 0.50 and "dependence" → "depressive" at 0.40)
// ═══════════════════════════════════════════════════════════════════════════

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

// Trigram similarity: compare overlapping 3-char sequences
function trigrams(str) {
  const s = `  ${str} `;
  const t = new Set();
  for (let i = 0; i < s.length - 2; i++) t.add(s.slice(i, i+3));
  return t;
}

function trigramSimilarity(a, b) {
  const ta = trigrams(a.toLowerCase());
  const tb = trigrams(b.toLowerCase());
  let intersection = 0;
  for (const t of ta) { if (tb.has(t)) intersection++; }
  const union = ta.size + tb.size - intersection;
  return union === 0 ? 0 : intersection / union;
}

// Character frequency similarity (handles scrambled letters)
function charFreqSimilarity(a, b) {
  const freqA = {}, freqB = {};
  for (const c of a.toLowerCase()) freqA[c] = (freqA[c] || 0) + 1;
  for (const c of b.toLowerCase()) freqB[c] = (freqB[c] || 0) + 1;
  const allChars = new Set([...Object.keys(freqA), ...Object.keys(freqB)]);
  let match = 0, total = 0;
  for (const c of allChars) {
    const ca = freqA[c] || 0, cb = freqB[c] || 0;
    match += Math.min(ca, cb);
    total += Math.max(ca, cb);
  }
  return total === 0 ? 0 : match / total;
}

// Bigram similarity (more forgiving than trigrams for short scrambled words)
function bigramSimilarity(a, b) {
  const bg = (s) => {
    const set = new Set();
    const padded = ` ${s.toLowerCase()} `;
    for (let i = 0; i < padded.length - 1; i++) set.add(padded.slice(i, i+2));
    return set;
  };
  const ba = bg(a), bb = bg(b);
  let intersection = 0;
  for (const t of ba) { if (bb.has(t)) intersection++; }
  const union = ba.size + bb.size - intersection;
  return union === 0 ? 0 : intersection / union;
}

// Combined fuzzy word match: best of multiple strategies
function wordSimilarity(input, target) {
  // Quick exact/prefix
  if (input === target) return 1;
  if (target.startsWith(input) || input.startsWith(target)) return 0.8;
  
  const lev = levenshtein(input, target);
  const maxLen = Math.max(input.length, target.length);
  const minLen = Math.min(input.length, target.length);
  const levSim = 1 - (lev / maxLen);
  
  const tSim = trigramSimilarity(input, target);
  const bSim = bigramSimilarity(input, target);
  const cSim = charFreqSimilarity(input, target);
  
  // Length ratio — words of very different lengths are unlikely matches
  const lenRatio = minLen / maxLen;
  
  // If lengths are too different (e.g. 6 vs 11), heavily discount charFreq
  // because short words often share letters with longer unrelated words
  const adjustedCharFreq = cSim * lenRatio;
  
  const bestNgram = Math.max(tSim, bSim);
  const combined = (bestNgram * 0.4) + (adjustedCharFreq * 0.35) + (levSim * 0.15) + (lenRatio * 0.1);
  
  return Math.max(combined, levSim, bestNgram);
}

// Find best matching word in target words for an input word
function bestWordMatch(inputWord, targetWords) {
  let bestSim = 0;
  let bestWord = '';
  for (const tw of targetWords) {
    const sim = wordSimilarity(inputWord, tw);
    if (sim > bestSim) { bestSim = sim; bestWord = tw; }
  }
  return { similarity: bestSim, word: bestWord };
}

      textarea.style.left = '-9999px';
      textarea.style.top = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast(`Copied: ${text}`);
    } catch(e) {
      // Try modern API as fallback
      navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied: ${text}`);
      }).catch(() => {
        showToast('Copy failed — try selecting manually');
      });
    }
  };

  const filtered = React.useMemo(() => {
    const q = debouncedQuery.trim();
    if (!q) {
      return DSM5_DATA.filter(item => !activeCategory || item.category === activeCategory);
    }
    // Fast path: if query looks clean (no obvious typos), use simple substring first
    const qLower = q.toLowerCase();
    const words = qLower.split(/\s+/).filter(w => w.length > 0);
    const exactMatches = DSM5_DATA.filter(item => {
      if (activeCategory && item.category !== activeCategory) return false;
      const target = `${item.diagnosis} ${item.fCode} ${item.icd9}`.toLowerCase();
      return words.every(w => target.includes(w));
    });
    if (exactMatches.length > 0 && exactMatches.length <= 30) {
      return exactMatches;
    }
    // Fuzzy path: use scoring
    const scored = DSM5_DATA
      .filter(item => !activeCategory || item.category === activeCategory)
      .map(item => ({ item, score: fuzzyScore(item, debouncedQuery) }))
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score);
    return scored.slice(0, 15).map(x => x.item);
  }, [debouncedQuery, activeCategory]);

  // Reset selection when results change
  React.useEffect(() => { setSelectedIndex(-1); }, [filtered]);

  // Common abbreviations lookup
  // (moved outside App for access by fuzzyScore)

  // Find matching diagnoses for autocomplete (prefix-based with typo tolerance)
  // Tolerant: if most core words match, still include even if trailing words don't
  // ═════════════════════════════════════════════════════════════════════
  // AUTOCOMPLETE MATCHING (used by IntelliSense dropdown)
  // ═════════════════════════════════════════════════════════════════════
  // PROBLEM SOLVED: Ghost text autocomplete (original approach) was confusing —
  // users couldn't see all available options or navigate branching specifiers.
  //
  // SOLUTION: Visual Basic-style IntelliSense dropdown with branching tree.
  // Type "Major Dep" → dropdown shows "Major depressive disorder"
  // Select it → shows "Single episode (7→)" | "Recurrent episode (7→)"
  // Select "Single episode" → shows "Mild (F32.0)" | "Moderate (F32.1)" | etc.
  //
  // MATCHING STRATEGY:
  //   - Strict: all input words must match diagnosis words (prefix or fuzzy ≥0.55)
  //   - Tolerant fallback: drops last 1-2 words if strict finds nothing
  //     (handles "Bipolar II Disorder, current" where "current" has no match)
  //   - Phrase synonyms applied (dependence → use disorder, heroin → opioid)
  //
  // PROBLEM SOLVED [P10]: "Opioid Use Disroder" didn't show Mild/Moderate/Severe
  //   FIX: Phrase synonym expansion in autocomplete converts "disroder" typo path
  //   to match "Opioid use disorder, Mild/Moderate/Severe" entries.
  //
  // PROBLEM SOLVED [P11]: "Bipolar Disroder" showed ALL bipolar entries (46)
  //   including substance-induced ones (Alcohol-induced bipolar, Cocaine-induced, etc.)
  //   FIX: computeIntellisenseOptions filters matches where first input word appears
  //   near the start of the diagnosis, excluding substance-induced entries.
  // ═════════════════════════════════════════════════════════════════════
  function findAutoCompleteMatches(q) {
    if (!q || q.length < 2) return [];
    const qLower = q.toLowerCase().trim();
    
    // Check abbreviations - both bare and with specifiers
    const abbrevExpansion = ABBREVIATIONS[qLower];
    if (abbrevExpansion) {
      return DSM5_DATA.filter(item => 
        item.diagnosis.toLowerCase().startsWith(abbrevExpansion)
      );
    }
    
    // Check if first word is abbreviation (e.g., "ADHD, combined")
    let expandedQ = qLower;
    const firstWord = qLower.split(/[\s,;\/()\-–—&>]+/)[0];
    if (ABBREVIATIONS[firstWord]) {
      expandedQ = qLower.replace(firstWord, ABBREVIATIONS[firstWord]);
    }
    
    // Apply phrase synonyms for autocomplete too
    const AC_PHRASE_SYN = {
      'sedative hypnotic and anxiolytic': 'sedative, hypnotic, or anxiolytic',
      'sedative-hypnotic and anxiolytic': 'sedative, hypnotic, or anxiolytic',
      'sedative hypnotic or anxiolytic': 'sedative, hypnotic, or anxiolytic',
      'sedative hypnotic anxiolytic': 'sedative, hypnotic, or anxiolytic',
      'sedative hypnotic': 'sedative, hypnotic, or anxiolytic',
      'sedative-hypnotic': 'sedative, hypnotic, or anxiolytic',
      'benzo': 'sedative, hypnotic, or anxiolytic',
      'benzodiazepine': 'sedative, hypnotic, or anxiolytic',
      'marijuana': 'cannabis', 'weed': 'cannabis',
      'heroin': 'opioid', 'crack': 'cocaine',
      'methamphetamine': 'amphetamine',
      'social phobia': 'social anxiety disorder',
      'soclia phobia': 'social anxiety disorder',
      'soical phobia': 'social anxiety disorder',
      'socal phobia': 'social anxiety disorder',
      'social fobia': 'social anxiety disorder',
      'dependence': 'use disorder', 'abuse': 'use disorder',
      'addiction': 'use disorder',
      'medical illness': 'medical condition',
      'another medical illness': 'another medical condition',
      'general medical condition': 'another medical condition',
      'mental illness': 'mental disorder',
      'another mental illness': 'another mental disorder',
      'psychiatric illness': 'mental disorder',
      'psychiatric condition': 'mental disorder',
      'psychiatric disorder': 'mental disorder',
      'use disroder': 'use disorder',
      'psychotic feaurs': 'psychotic features',
      'psychotic featurs': 'psychotic features',
      'd/o': 'disorder',
      'w/o': 'without',
      'bipolar 1': 'bipolar i',
      'bipolar 2': 'bipolar ii',
      'bipolar type 1': 'bipolar i',
      'bipolar type 2': 'bipolar ii',
      'bp1': 'bipolar i',
      'bp2': 'bipolar ii',
      'bp 1': 'bipolar i',
      'bp 2': 'bipolar ii',
    };
    const acSorted = Object.entries(AC_PHRASE_SYN).sort((a,b) => b[0].length - a[0].length);
    let phraseExpanded = false;
    for (const [from, to] of acSorted) {
      const re = new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      if (re.test(expandedQ)) { expandedQ = expandedQ.replace(re, to); phraseExpanded = true; }
    }
    
    // PARTIAL PHRASE PREFIX: if the user is mid-typing a phrase synonym key
    // (e.g., "sedative h" or "sedative hyp"), expand to the full synonym
    // so IntelliSense stays populated while typing
    if (!phraseExpanded) {
      for (const [from, to] of acSorted) {
        if (from.length > expandedQ.length && from.startsWith(expandedQ)) {
          // User is typing the beginning of a known phrase
          expandedQ = to;
          phraseExpanded = true;
          break;
        }
        // Also check if expandedQ is a prefix of the key with partial last word
        // e.g., "sedative h" is a prefix of "sedative hypnotic" 
        const fromWords = from.split(/[\s]+/);
        const expWords = expandedQ.split(/[\s,]+/).filter(w => w.length > 0);
        if (fromWords.length >= 2 && expWords.length >= 1) {
          let allMatch = true;
          for (let i = 0; i < expWords.length; i++) {
            if (i < fromWords.length - 1) {
              // Full words must match exactly
              if (expWords[i] !== fromWords[i]) { allMatch = false; break; }
            } else if (i === fromWords.length - 1 || i === expWords.length - 1) {
              // Last word can be prefix
              if (!fromWords[Math.min(i, fromWords.length-1)].startsWith(expWords[i])) { allMatch = false; break; }
            } else {
              allMatch = false; break;
            }
          }
          if (allMatch && expWords.length <= fromWords.length) {
            expandedQ = to;
            phraseExpanded = true;
            break;
          }
        }
      }
    }
    for (const [from, to] of acSorted) {
      const re = new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      if (re.test(expandedQ)) expandedQ = expandedQ.replace(re, to);
    }

    // Fuzzy single-word corrections for autocomplete
    const AC_WORD_FIXES = {
      'disorder': ['disroder', 'disordr', 'disode', 'disoder', 'diroder', 'diorder'],
      'features': ['feaurs', 'featurs', 'feautres', 'feturs'],
      'condition': ['conditon', 'condtion'],
      'hypnotic': ['hypotic', 'hypntic', 'hynotic'],
      'anxiolytic': ['anxiolyic', 'anxioltic'],
      'psychotic': ['pychotic', 'psyhotic', 'psychtic'],
      'recurrent': ['recurent', 'reccurent', 'recurrant'],
    };
    for (const [correct, typos] of Object.entries(AC_WORD_FIXES)) {
      for (const typo of typos) {
        const typoRe = new RegExp('\\b' + typo + '\\b', 'gi');
        expandedQ = expandedQ.replace(typoRe, correct);
      }
    }

    // Fuzzy compound term recognition for autocomplete
    // If user typed something close to "sedative hypnotic anxiolytic" with typos
    if (!expandedQ.includes('sedative, hypnotic, or anxiolytic')) {
      const eWords = expandedQ.split(/[\s,;\/()\-–—&>]+/).filter(w => w.length >= 3);
      const sedKws = ['sedative', 'hypnotic', 'anxiolytic'];
      let sedMatches = 0;
      for (const w of eWords) {
        for (const kw of sedKws) {
          if (w === kw || (w.length >= 4 && kw.startsWith(w.slice(0, 4))) || 
              (w.length >= 5 && kw.length >= 5 && wordSimilarity(w, kw) >= 0.55)) {
            sedMatches++;
            break;
          }
        }
      }
      if (sedMatches >= 2) {
        // Replace the compound with the canonical form, keep any trailing words
        const trailingWords = eWords.filter(w => {
          for (const kw of sedKws) {
            if (w === kw || (w.length >= 4 && kw.startsWith(w.slice(0, 4))) ||
                (w.length >= 5 && wordSimilarity(w, kw) >= 0.55)) return false;
          }
          return w !== 'and' && w !== 'or' && w !== 'of';
        });
        expandedQ = ['sedative, hypnotic, or anxiolytic', ...trailingWords].join(' ');
        phraseExpanded = true;
      }
    }
    
    const inputWords = expandedQ.split(/[\s,;\/()\-–—&>]+/).filter(w => w.length >= 1);
    
    // First try: strict match (all words must match)
    const strictMatches = DSM5_DATA.filter(item => {
      const diagLower = item.diagnosis.toLowerCase();
      const diagWords = diagLower.split(/[\s,/()-]+/).filter(w => w.length > 0);
      let diagIdx = 0;
      for (const iw of inputWords) {
        let found = false;
        for (let j = diagIdx; j < diagWords.length; j++) {
          if (iw.length <= 2) {
            if (diagWords[j] === iw) { found = true; diagIdx = j + 1; break; }
          } else if (iw.length === 3) {
            if (diagWords[j].startsWith(iw)) { found = true; diagIdx = j + 1; break; }
          } else {
            if (diagWords[j].startsWith(iw)) { found = true; diagIdx = j + 1; break; }
            if (diagWords[j].length >= 4 && iw[0] === diagWords[j][0]) {
              if (wordSimilarity(iw, diagWords[j]) >= 0.55) { found = true; diagIdx = j + 1; break; }
            }
          }
        }
        if (!found) return false;
      }
      return true;
    });
    
    if (strictMatches.length > 0) {
      // Prefer entries where input words match at the START of the diagnosis name
      // e.g., "opioid use disorder" should prefer "Opioid use disorder, Mild" over
      // "Opioid intoxication delirium, With mild use disorder"
      const prefixStr = inputWords.join(' ');
      const prefixMatches = strictMatches.filter(item => {
        const diagLower = item.diagnosis.toLowerCase();
        const diagWords = diagLower.split(/[\s,/()-]+/).filter(w => w.length > 0);
        // Check that all input words match the FIRST N words of the diagnosis
        if (inputWords.length > diagWords.length) return false;
        for (let k = 0; k < inputWords.length; k++) {
          const iw = inputWords[k];
          const dw = diagWords[k];
          if (iw.length <= 2) {
            if (dw !== iw) return false;
          } else if (iw.length === 3) {
            if (!dw.startsWith(iw)) return false;
          } else {
            if (!dw.startsWith(iw) && !(dw.length >= 4 && iw[0] === dw[0] && wordSimilarity(iw, dw) >= 0.55)) return false;
          }
        }
        return true;
      });
      if (prefixMatches.length > 0) return prefixMatches;
      return strictMatches;
    }
    
    // Fallback: tolerant match — allow last 1-2 words to not match
    // This handles cases like "Bipolar II Disorder, current" where "current" has no match
    if (inputWords.length >= 3) {
      for (let dropCount = 1; dropCount <= Math.min(2, inputWords.length - 2); dropCount++) {
        const partialWords = inputWords.slice(0, inputWords.length - dropCount);
        const partialMatches = DSM5_DATA.filter(item => {
          const diagLower = item.diagnosis.toLowerCase();
          const diagWords = diagLower.split(/[\s,/()-]+/).filter(w => w.length > 0);
          let diagIdx = 0;
          for (const iw of partialWords) {
            let found = false;
            for (let j = diagIdx; j < diagWords.length; j++) {
              if (iw.length <= 2) {
                if (diagWords[j] === iw) { found = true; diagIdx = j + 1; break; }
              } else if (iw.length === 3) {
                if (diagWords[j].startsWith(iw)) { found = true; diagIdx = j + 1; break; }
              } else {
                if (diagWords[j].startsWith(iw)) { found = true; diagIdx = j + 1; break; }
                if (diagWords[j].length >= 4 && iw[0] === diagWords[j][0]) {
                  if (wordSimilarity(iw, diagWords[j]) >= 0.55) { found = true; diagIdx = j + 1; break; }
                }
              }
            }
            if (!found) return false;
          }
          return true;
        });
        if (partialMatches.length > 0 && partialMatches.length <= 50) return partialMatches;
      }
    }
    
    return [];
  }

  // Get ghost suggestion from matches: common prefix up to branch point
  function getGhostFromMatches(matches, typed) {
    if (matches.length === 0) return { suggestion: '', fullDiagnosis: '' };
    
    if (matches.length === 1) {
      const full = matches[0].diagnosis;
      return { suggestion: full, fullDiagnosis: full };
    }
    
    // Find longest common prefix from the DIAGNOSIS names (not user text)
    const names = matches.map(m => m.diagnosis);
    let prefix = names[0];
    for (let i = 1; i < names.length; i++) {
      while (prefix.length > 0 && !names[i].toLowerCase().startsWith(prefix.toLowerCase())) {
        prefix = prefix.slice(0, -1);
      }
    }
    // Clean to word/comma boundary
    let cleaned = prefix.replace(/[\s,]+$/, '');
    
    // If common prefix doesn't add new info, show the next segment from shortest match
    if (cleaned.length <= typed.length) {
      const shortest = names.reduce((a, b) => a.length <= b.length ? a : b);
      // Find next comma-separated segment after the common prefix
      const afterPrefix = shortest.slice(cleaned.length);
      const trimmedAfter = afterPrefix.replace(/^[\s,]+/, '');
      const nextComma = trimmedAfter.indexOf(',');
      if (nextComma > 0) {
        cleaned = cleaned + afterPrefix.slice(0, afterPrefix.indexOf(trimmedAfter) + nextComma);
      } else {
        cleaned = shortest;
      }
      cleaned = cleaned.replace(/[\s,]+$/, '');
    }
    
    // Always return the correct diagnosis prefix text (never user's typo text)
    if (cleaned.length <= 0) return { suggestion: '', fullDiagnosis: '' };
    return { suggestion: cleaned, fullDiagnosis: cleaned };
  }

  // IntelliSense: compute branch options from current input
  // ═════════════════════════════════════════════════════════════════════
  // INTELLISENSE BRANCHING TREE COMPUTATION
  // ═════════════════════════════════════════════════════════════════════
  // Takes a set of matching diagnoses and computes the next branch options.
  //
  // ALGORITHM:
  //   1. Find longest common prefix of all matching diagnosis names
  //   2. If prefix is too short (< 5 chars or < 2 words), use "base grouping"
  //      — group by first comma-delimited segment (the base diagnosis name)
  //   3. Otherwise, extract next comma-delimited segment after prefix
  //   4. Determine if segment is a branch (leads to more options) or leaf (final)
  //   5. Return options with branch count or F-code for leaves
  //
  // PROBLEM SOLVED [P12]: When common prefix is empty (matches span unrelated
  //   base diagnoses), the old code showed all segments at once as a flat list.
  //   FIX: useBaseGrouping flag detects this case and groups by base diagnosis.
  //
  // PROBLEM SOLVED [P13]: "Bipolar Disroder" matched substance-induced entries.
  //   FIX: Start-match filter prefers diagnoses where first input word appears
  //   in the first 3 words (filters "Alcohol-induced bipolar..." since "bipolar"
  //   is word 2 of user input but word 3+ of the substance-induced entry).
  // ═════════════════════════════════════════════════════════════════════
  function computeIntellisenseOptions(matches, inputText) {
    if (matches.length === 0) return { options: [], matches: [], commonPrefix: '' };
    if (matches.length === 1) {
      return {
        options: [{ label: matches[0].diagnosis, fCode: matches[0].fCode, fullDiagnosis: matches[0].diagnosis, isBranch: false }],
        matches,
        commonPrefix: matches[0].diagnosis
      };
    }
    
    // Prefer matches where input words appear near the start of the diagnosis
    // e.g., "Bipolar disorder" should prefer "Bipolar I disorder" over "Alcohol-induced bipolar..."
    const inputWords = inputText.toLowerCase().split(/[\s,;\/()\-–—&>]+/).filter(w => w.length >= 2);
    if (inputWords.length > 0) {
      const startMatches = matches.filter(m => {
        const diagLower = m.diagnosis.toLowerCase();
        // Check if the first significant input word appears in the first few words of diagnosis
        const firstInputWord = inputWords[0];
        const diagFirstWords = diagLower.split(/[\s,/()-]+/).slice(0, 3);
        return diagFirstWords.some(dw => dw.startsWith(firstInputWord) || wordSimilarity(firstInputWord, dw) >= 0.55);
      });
      // If we have start-matches, use only those (filters out substance-induced etc.)
      if (startMatches.length > 0 && startMatches.length < matches.length) {
        matches = startMatches;
      }
    }
    
    // Find the longest common prefix of all matching diagnoses
    const names = matches.map(m => m.diagnosis);
    let prefix = names[0];
    for (let i = 1; i < names.length; i++) {
      while (prefix.length > 0 && !names[i].toLowerCase().startsWith(prefix.toLowerCase())) {
        prefix = prefix.slice(0, -1);
      }
    }
    const commonPrefix = prefix.replace(/[\s,]+$/, '');
    
    // If common prefix is very short or empty, group by base diagnosis (first comma segment)
    const useBaseGrouping = commonPrefix.length < 5 || commonPrefix.split(/[\s]+/).length < 2;
    
    const segmentMap = new Map();
    for (const m of matches) {
      let segment, partialDiagnosis;
      
      if (useBaseGrouping) {
        // Group by full base diagnosis name (up to first comma)
        const commaIdx = m.diagnosis.indexOf(',');
        segment = commaIdx >= 0 ? m.diagnosis.slice(0, commaIdx).trim() : m.diagnosis.trim();
        partialDiagnosis = segment;
      } else {
        const afterPrefix = m.diagnosis.slice(commonPrefix.length);
        const trimmed = afterPrefix.replace(/^[\s,]+/, '');
        if (!trimmed) {
          segmentMap.set('(base)', { 
            items: [m], 
            fullDiagnosis: m.diagnosis, 
            isBranch: false 
          });
          continue;
        }
        const commaIdx = trimmed.indexOf(',');
        segment = commaIdx >= 0 ? trimmed.slice(0, commaIdx).trim() : trimmed.trim();
        partialDiagnosis = commonPrefix + (afterPrefix.match(/^[\s,]+/) || [''])[0] + segment;
      }
      
      if (!segmentMap.has(segment)) {
        const subMatches = matches.filter(mm => mm.diagnosis.toLowerCase().startsWith(partialDiagnosis.toLowerCase()));
        const hasDeeper = subMatches.some(mm => mm.diagnosis.length > partialDiagnosis.length && mm.diagnosis.charAt(partialDiagnosis.length) === ',');
        const isBranch = subMatches.length > 1 || hasDeeper;
        segmentMap.set(segment, {
          items: subMatches,
          fullDiagnosis: partialDiagnosis,
          isBranch,
          fCode: subMatches.length === 1 ? subMatches[0].fCode : ''
        });
      }
    }
    
    const options = [];
    for (const [label, data] of segmentMap) {
      const displayLabel = label === '(base)' ? commonPrefix : label;
      options.push({
        label: displayLabel,
        fCode: data.items.length === 1 ? data.items[0].fCode : data.fCode || '',
        fullDiagnosis: data.fullDiagnosis || commonPrefix,
        isBranch: data.isBranch,
        count: data.items.length
      });
    }
    
    // Sort: branches with more items first, then alphabetical
    options.sort((a, b) => {
      if (a.label === '(base)') return -1;
      if (b.label === '(base)') return 1;
      return (b.count || 0) - (a.count || 0) || a.label.localeCompare(b.label);
    });
    
    return { options, matches, commonPrefix };
  }

  const intellisense = React.useMemo(() => {
    const q = query.trim();
    if (!q || q.length < 2) return { options: [], matches: [], commonPrefix: '' };
    const matches = findAutoCompleteMatches(q);
    return computeIntellisenseOptions(matches, q);
  }, [query]);

  const [dropdownIndex, setDropdownIndex] = React.useState(-1);
  const [showDropdown, setShowDropdown] = React.useState(false);
  const inputRef = React.useRef(null);

  // Show dropdown when intellisense has options and query is active
  React.useEffect(() => {
    setShowDropdown(intellisense.options.length > 0 && query.trim().length >= 2);
    setDropdownIndex(-1);
  }, [intellisense.options, query]);

  // Handle selecting an intellisense option
  // IntelliSense selection handler
  // Branch: appends to query with ", " and re-triggers IntelliSense for next level
  // Leaf: sets full diagnosis text and copies F-code to clipboard
  const selectOption = (opt) => {
    if (opt.isBranch) {
      // Navigate deeper into the tree
      setQuery(opt.fullDiagnosis + ', ');
      if (inputRef.current) inputRef.current.focus();
    } else {
      // Final selection — set the query and copy the F code
      setQuery(opt.fullDiagnosis);
      copyToClipboard(opt.fCode);
      setShowDropdown(false);
    }
  };

  // Keyboard navigation for dropdown
  const handleKeyDown = (e) => {
    if (showDropdown && intellisense.options.length > 0) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setDropdownIndex(i => Math.min(i + 1, intellisense.options.length - 1));
        return;
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setDropdownIndex(i => Math.max(i - 1, -1));
        return;
      } else if (e.key === 'Enter' && dropdownIndex >= 0) {
        e.preventDefault();
        selectOption(intellisense.options[dropdownIndex]);
        return;
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (dropdownIndex >= 0) {
          selectOption(intellisense.options[dropdownIndex]);
        } else if (intellisense.options.length === 1) {
          selectOption(intellisense.options[0]);
        } else if (intellisense.commonPrefix.length > query.trim().length) {
          setQuery(intellisense.commonPrefix);
        }
        return;
      } else if (e.key === 'Escape') {
        setShowDropdown(false);
        return;
      }
    }
    // Fallback: arrow keys for table navigation when dropdown is closed
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setSelectedIndex(i => Math.min(i + 1, filtered.length - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setSelectedIndex(i => Math.max(i - 1, -1));
    } else if (e.key === 'Enter' && selectedIndex >= 0 && filtered[selectedIndex]) {
      e.preventDefault();
      copyToClipboard(filtered[selectedIndex].fCode);
    }
  };

  // ═══════════════════════════════════════════════════════════════════
  // BULK LOOKUP WITH NON-PSYCHIATRIC PASSTHROUGH
  // ═══════════════════════════════════════════════════════════════════
  // PROBLEM SOLVED: Clinicians paste mixed diagnosis lists from EMRs
  // containing both psychiatric AND medical diagnoses. Originally,
  // medical diagnoses got force-matched to wrong psych entries
  // ("Hypertension" → "Hypoventilation").
  //
  // SOLUTION: bestMatch returns null for non-psychiatric input.
  // Bulk mode preserves the original text and any embedded ICD code:
  //   "Major depressive disorder"        → F32.0 (matched)
  //   "Hypertension - I10"               → I10 (passed through)
  //   "Iron deficiency anemia (D50.0)"   → D50.0 (passed through)
  //   "Chronic back pain"                → — (passed through, no code)
  // ═══════════════════════════════════════════════════════════════════
  const handleBulkLookup = () => {
    const lines = bulkInput.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    // Split each line into segments on ';' or '&' for mixed psych+medical lists
    const segments = [];
    for (const line of lines) {
      const parts = line.split(/[;&>]/);
      for (const part of parts) {
        const seg = part.trim();
        if (seg) segments.push(seg);
      }
    }
    const results = segments.map(seg => {
      const match = bestMatch(seg, DSM5_DATA);
      const { embeddedCode } = cleanInput(seg);
      return {
        input: seg,
        match,
        usedCode: embeddedCode && match && match.fCode.toUpperCase() === embeddedCode,
        embeddedCode: embeddedCode || null
      };
    });
    setBulkResults(results);
  };

  // Bulk IntelliSense for the current line
  const bulkIntellisense = React.useMemo(() => {
    if (!bulkInput) return { options: [], matches: [], commonPrefix: '' };
    const lines = bulkInput.split('\n');
    const lastLine = lines[lines.length - 1].trim();
    if (lastLine.length < 2) return { options: [], matches: [], commonPrefix: '' };
    const matches = findAutoCompleteMatches(lastLine);
    return computeIntellisenseOptions(matches, lastLine);
  }, [bulkInput]);

  const [bulkDropdownIndex, setBulkDropdownIndex] = React.useState(-1);
  const [showBulkDropdown, setShowBulkDropdown] = React.useState(false);
  const bulkRef = React.useRef(null);

  React.useEffect(() => {
    setShowBulkDropdown(bulkIntellisense.options.length > 0 && bulkInput.trim().length >= 2);
    setBulkDropdownIndex(-1);
  }, [bulkIntellisense.options, bulkInput]);

  const selectBulkOption = (opt) => {
    const lines = bulkInput.split('\n');
    if (opt.isBranch) {
      lines[lines.length - 1] = opt.fullDiagnosis + ', ';
      setBulkInput(lines.join('\n'));
      if (bulkRef.current) bulkRef.current.focus();
    } else {
      lines[lines.length - 1] = opt.fullDiagnosis;
      setBulkInput(lines.join('\n'));
      setShowBulkDropdown(false);
    }
  };

  const handleBulkKeyDown = (e) => {
    if (showBulkDropdown && bulkIntellisense.options.length > 0) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setBulkDropdownIndex(i => Math.min(i + 1, bulkIntellisense.options.length - 1));
        return;
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setBulkDropdownIndex(i => Math.max(i - 1, -1));
        return;
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (bulkDropdownIndex >= 0) {
          selectBulkOption(bulkIntellisense.options[bulkDropdownIndex]);
        } else if (bulkIntellisense.options.length === 1) {
          selectBulkOption(bulkIntellisense.options[0]);
        }
        return;
      } else if (e.key === 'Enter' && bulkDropdownIndex >= 0) {
        e.preventDefault();
        selectBulkOption(bulkIntellisense.options[bulkDropdownIndex]);
        return;
      } else if (e.key === 'Escape') {
        setShowBulkDropdown(false);
        return;
      }
    }
  };

  const copyAllBulk = () => {
    if (!bulkResults) return;
    const text = bulkResults
      .map(r => {
        if (r.match) return `${r.match.diagnosis}\t${r.match.fCode}`;
        if (r.embeddedCode) return `${r.input}\t${r.embeddedCode}`;
        return `${r.input}\t—`;
      })
      .join('\n');
    copyToClipboard(text);
  };

  // Comma-delimited F-code summary string
  const fcodeSummary = React.useMemo(() => {
    if (!bulkResults) return '';
    return bulkResults
      .map(r => {
        if (r.match) return r.match.fCode;
        if (r.embeddedCode) return r.embeddedCode;
        return null;
      })
      .filter(Boolean)
      .join(', ');
  }, [bulkResults]);

  // Queue: list of codes for sequential copy
  const queueCodes = React.useMemo(() => {
    if (!bulkResults) return [];
    return bulkResults
      .map(r => {
        if (r.match) return { code: r.match.fCode, label: r.match.diagnosis };
        if (r.embeddedCode) return { code: r.embeddedCode, label: r.input };
        return null;
      })
      .filter(Boolean);
  }, [bulkResults]);

  const startQueue = () => {
    if (queueCodes.length === 0) return;
    setQueueIndex(0);
    setQueueActive(true);
    copyToClipboard(queueCodes[0].code);
  };

  const nextInQueue = () => {
    const next = queueIndex + 1;
    if (next < queueCodes.length) {
      setQueueIndex(next);
      copyToClipboard(queueCodes[next].code);
    } else {
      // Queue finished
      setQueueActive(false);
      showToast('✅ All codes pasted — queue complete!');
    }
  };

  const resetQueue = () => {
    setQueueIndex(-1);
    setQueueActive(false);
  };

  return React.createElement('div', { className: 'app' },
    React.createElement('header', null,
      React.createElement('h1', null, 'DSM-5 → ', React.createElement('span', null, 'F Code'), ' Lookup'),
      React.createElement('p', null,
        `${DSM5_DATA.length} diagnoses · v2.2 · ICD-10-CM codes · Click any row to copy · `,
        React.createElement('a', {
          href: '#',
          className: 'info-link',
          onClick: (e) => { e.preventDefault(); setShowInfo(true); }
        }, 'Features & Guide')
      )
    ),

    React.createElement('div', { className: 'mode-toggle' },
      React.createElement('button', {
        className: `mode-btn ${mode === 'search' ? 'active' : ''}`,
        onClick: () => setMode('search')
      }, '🔍 Search'),
      React.createElement('button', {
        className: `mode-btn ${mode === 'bulk' ? 'active' : ''}`,
        onClick: () => setMode('bulk')
      }, '📋 Bulk Lookup')
    ),

    mode === 'search' ? React.createElement(React.Fragment, null,
      React.createElement('div', { className: 'search-box' },
        React.createElement('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
          React.createElement('circle', { cx: 11, cy: 11, r: 8 }),
          React.createElement('path', { d: 'M21 21l-4.35-4.35' })
        ),
        React.createElement('input', {
          ref: inputRef,
          type: 'text',
          placeholder: 'Start typing a diagnosis — dropdown will guide you...',
          value: query,
          onChange: (e) => setQuery(e.target.value),
          onKeyDown: handleKeyDown,
          onBlur: () => setTimeout(() => setShowDropdown(false), 200),
          onFocus: () => { if (intellisense.options.length > 0) setShowDropdown(true); },
          autoFocus: true
        }),
        // IntelliSense dropdown
        showDropdown && intellisense.options.length > 0 && React.createElement('div', { className: 'intellisense-dropdown' },
          React.createElement('div', { className: 'intellisense-header' },
            intellisense.matches.length + ' matches — Select next specifier'
          ),
          intellisense.options.map((opt, i) =>
            React.createElement('div', {
              key: i,
              ref: i === dropdownIndex ? (el) => { if (el) el.scrollIntoView({ block: 'nearest' }); } : null,
              className: `intellisense-item ${i === dropdownIndex ? 'selected' : ''}`,
              onMouseDown: (e) => { e.preventDefault(); selectOption(opt); },
              onMouseEnter: () => setDropdownIndex(i)
            },
              React.createElement('span', { className: 'label' }, opt.label),
              opt.isBranch && React.createElement('span', { className: 'is-branch' }, opt.count + ' →'),
              opt.fCode && !opt.isBranch && React.createElement('span', { className: 'fcode' }, opt.fCode)
            )
          ),
          React.createElement('div', { className: 'intellisense-keys' },
            React.createElement('span', null, React.createElement('kbd', null, '↑↓'), ' navigate'),
            React.createElement('span', null, React.createElement('kbd', null, 'Enter'), ' select'),
            React.createElement('span', null, React.createElement('kbd', null, 'Tab'), ' accept'),
            React.createElement('span', null, React.createElement('kbd', null, 'Esc'), ' close')
          )
        )
      ),

      React.createElement('div', { className: 'category-chips' },
        React.createElement('button', {
          className: `chip ${!activeCategory ? 'active' : ''}`,
          onClick: () => setActiveCategory(null)
        }, 'All'),
        ...CATEGORIES.map(cat =>
          React.createElement('button', {
            key: cat,
            className: `chip ${activeCategory === cat ? 'active' : ''}`,
            onClick: () => setActiveCategory(activeCategory === cat ? null : cat)
          }, cat)
        )
      ),

      React.createElement('div', { className: 'stats-bar' },
        React.createElement('span', null, 'Showing ', React.createElement('strong', null, filtered.length), ' of ', DSM5_DATA.length, ' diagnoses')
      ),

      React.createElement('div', { className: 'results-scroll' },
        filtered.length > 0 ?
          React.createElement('table', { className: 'results-table' },
            React.createElement('thead', null,
              React.createElement('tr', null,
                React.createElement('th', null, 'F Code'),
                React.createElement('th', null, 'Diagnosis'),
                React.createElement('th', null, 'ICD-9')
              )
            ),
            React.createElement('tbody', null,
              filtered.map((item, i) =>
                React.createElement('tr', {
                  key: i,
                  onClick: () => copyToClipboard(item.fCode),
                  className: i === selectedIndex ? 'selected-row' : '',
                  ref: i === selectedIndex ? (el) => { if (el) el.scrollIntoView({ block: 'nearest' }); } : null
                },
                  React.createElement('td', null,
                    React.createElement('span', { className: 'f-code' }, item.fCode)
                  ),
                  React.createElement('td', null,
                    React.createElement('div', { className: 'diagnosis-name' }, highlightMatch(item.diagnosis, query)),
                    React.createElement('div', { className: 'category-tag' }, item.category)
                  ),
                  React.createElement('td', null,
                    React.createElement('span', { className: 'icd9' }, item.icd9)
                  )
                )
              )
            )
          )
        : React.createElement('div', { className: 'empty-state' },
            React.createElement('div', { className: 'icon' }, '🔍'),
            React.createElement('p', null, 'No diagnoses match your search')
          )
      )
    ) : React.createElement(React.Fragment, null,
      React.createElement('div', { className: 'bulk-box' },
        React.createElement('textarea', {
          ref: bulkRef,
          placeholder: 'Type diagnoses here, one per line. Dropdown will guide specifiers.\n\nExamples:\nMajor Depressive Disorder → select episode → select severity\nBipolar I → select episode type → select specifier\nPTSD\nADHD Combined',
          value: bulkInput,
          onChange: (e) => setBulkInput(e.target.value),
          onKeyDown: handleBulkKeyDown,
          onBlur: () => setTimeout(() => setShowBulkDropdown(false), 200),
          onFocus: () => { if (bulkIntellisense.options.length > 0) setShowBulkDropdown(true); }
        }),
        showBulkDropdown && bulkIntellisense.options.length > 0 && React.createElement('div', { className: 'intellisense-dropdown' },
          React.createElement('div', { className: 'intellisense-header' },
            bulkIntellisense.matches.length + ' matches — Select next specifier'
          ),
          bulkIntellisense.options.map((opt, i) =>
            React.createElement('div', {
              key: i,
              ref: i === bulkDropdownIndex ? (el) => { if (el) el.scrollIntoView({ block: 'nearest' }); } : null,
              className: `intellisense-item ${i === bulkDropdownIndex ? 'selected' : ''}`,
              onMouseDown: (e) => { e.preventDefault(); selectBulkOption(opt); },
              onMouseEnter: () => setBulkDropdownIndex(i)
            },
              React.createElement('span', { className: 'label' }, opt.label),
              opt.isBranch && React.createElement('span', { className: 'is-branch' }, opt.count + ' →'),
              opt.fCode && !opt.isBranch && React.createElement('span', { className: 'fcode' }, opt.fCode)
            )
          ),
          React.createElement('div', { className: 'intellisense-keys' },
            React.createElement('span', null, React.createElement('kbd', null, '↑↓'), ' navigate'),
            React.createElement('span', null, React.createElement('kbd', null, 'Enter'), ' select'),
            React.createElement('span', null, React.createElement('kbd', null, 'Tab'), ' accept'),
            React.createElement('span', null, React.createElement('kbd', null, 'Esc'), ' close')
          )
        ),
        React.createElement('span', { className: `bulk-tab-hint ${showBulkDropdown ? 'visible' : ''}` }, 'Tab ↹')
      ),
      React.createElement('div', { className: 'bulk-actions' },
        React.createElement('button', { className: 'btn btn-primary', onClick: handleBulkLookup }, 'Look Up Codes'),
        React.createElement('button', { className: 'btn btn-secondary', onClick: () => { setBulkInput(''); setBulkResults(null); resetQueue(); } }, 'Clear'),
        // F-Code summary textbox inline with buttons
        bulkResults && fcodeSummary && React.createElement('div', { className: 'fcode-summary-box', style: { flex: 1, marginTop: 0 } },
          React.createElement('input', {
            type: 'text',
            readOnly: true,
            value: fcodeSummary,
            placeholder: 'F-codes will appear here...',
            onClick: (e) => { e.target.select(); copyToClipboard(fcodeSummary); }
          })
        )
      ),

      // Sequential Queue Copy-Paste feature — positioned right below buttons
      bulkResults && queueCodes.length > 0 && React.createElement('div', { className: 'queue-copy-section' },
        React.createElement('div', { className: 'queue-copy-header' },
          React.createElement('span', { className: 'queue-title' }, '🔄 Sequential Queue Copy'),
          queueActive && React.createElement('span', { className: 'queue-counter' },
            `${queueIndex + 1} / ${queueCodes.length}`
          )
        ),

        // Visual code chips with delimiter color indicator
        React.createElement('div', { className: 'queue-codes-display' },
          queueCodes.map((item, i) => {
            let chipClass = 'queue-code-chip ';
            let delimClass = 'queue-code-delimiter ';
            if (!queueActive) {
              chipClass += 'pending';
              delimClass += '';
            } else if (i < queueIndex) {
              chipClass += 'done';
              delimClass += 'done';
            } else if (i === queueIndex) {
              chipClass += 'current';
              delimClass += 'current';
            } else {
              chipClass += 'pending';
            }
            return React.createElement(React.Fragment, { key: i },
              React.createElement('span', { className: chipClass, title: item.label }, item.code),
              i < queueCodes.length - 1 && React.createElement('span', { className: delimClass }, '→')
            );
          })
        ),

        // Actions
        React.createElement('div', { className: 'queue-actions' },
          !queueActive
            ? React.createElement('button', { className: 'btn btn-primary', onClick: startQueue }, '▶ Start Queue')
            : React.createElement(React.Fragment, null,
                queueIndex < queueCodes.length - 1
                  ? React.createElement('button', { className: 'btn btn-primary', onClick: nextInQueue }, '⏭ Next Code')
                  : React.createElement('button', { className: 'btn btn-primary', onClick: nextInQueue }, '✅ Finish'),
                React.createElement('button', { className: 'btn btn-secondary', onClick: resetQueue, style: { padding: '8px 14px' } }, '↺ Reset')
              ),
          queueActive && queueIndex < queueCodes.length && React.createElement('span', { className: 'queue-current-label' },
            queueCodes[queueIndex] && `Copied: ${queueCodes[queueIndex].code} — ${queueCodes[queueIndex].label}`
          )
        )
      ),

      bulkResults && React.createElement('div', { className: 'bulk-results' },
        React.createElement('div', { className: 'copy-all-bar' },
          React.createElement('button', { className: 'btn btn-secondary', onClick: copyAllBulk, style: { padding: '6px 14px', fontSize: '12px' } }, '📋 Copy All Results')
        ),
        bulkResults.map((r, i) =>
          React.createElement('div', {
            key: i,
            className: 'bulk-result-row' + (!r.match ? ' passthrough' : ''),
            onClick: () => {
              if (r.match) copyToClipboard(r.match.fCode);
              else if (r.embeddedCode) copyToClipboard(r.embeddedCode);
            }
          },
            React.createElement('div', { className: 'diagnosis-info' },
              React.createElement('div', { className: 'input-text' }, `"${r.input}"`),
              r.match
                ? React.createElement('div', { className: 'match-text' }, `→ ${r.match.diagnosis}`)
                : React.createElement('div', { className: 'passthrough-text' }, '→ Non-DSM diagnosis — passed through as entered')
            ),
            r.match
              ? React.createElement('span', { className: 'f-code' }, r.match.fCode)
              : r.embeddedCode
                ? React.createElement('span', { className: 'f-code passthrough-code' }, r.embeddedCode)
                : React.createElement('span', { className: 'passthrough-label' }, '—')
          )
        )
      )
    ),

    // Info modal
    showInfo && React.createElement('div', { className: 'modal-overlay', onClick: (e) => { if (e.target.className === 'modal-overlay') setShowInfo(false); } },
      React.createElement('div', { className: 'modal-content' },
        React.createElement('button', { className: 'modal-close', onClick: () => setShowInfo(false) }, '✕'),
        React.createElement('div', { className: 'modal-body', dangerouslySetInnerHTML: { __html: FEATURE_HTML } })
      )
    ),

    React.createElement('div', { className: `copy-toast ${toast ? 'show' : ''}` }, toast),

    // Footer with copyright and disclaimer
    React.createElement('footer', { style: {
      marginTop: '40px',
      paddingTop: '20px',
      borderTop: '1px solid var(--border)',
      textAlign: 'center',
      fontSize: '12px',
      lineHeight: '1.6',
      color: 'var(--text-dim)',
      opacity: 0.6
    } },
      React.createElement('p', { style: { margin: '0 0 4px' } },
        `DSM-5 → F-Code Lookup v2.2 · © ${new Date().getFullYear()} Steve Chennankara, D.O.`
      ),
      React.createElement('p', { style: { margin: '0 0 4px' } },
        'Not to be reproduced or distributed without written permission.'
      ),
      React.createElement('p', { style: { margin: '0', fontSize: '11px', opacity: 0.8 } },
        'Clinical reference aid only — does not replace professional judgment. Verify codes against current CMS code sets before billing. ',
        'DSM-5® and DSM-5-TR® are registered trademarks of the American Psychiatric Association. Not affiliated with or endorsed by the APA.'
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('/'))));
    });
  `], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
